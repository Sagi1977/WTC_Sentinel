name: WTC Sentinel Execution
# 🔧 01/10/2026 — גרסה פשוטה לבקשת המשתמש:
#   ריצה כל שעה עגולה 17:00–23:00 שעון ישראל, שני–שישי.
#   timezone: Asia/Jerusalem — GitHub עצמו מטפל בשעון קיץ/חורף בישראל.
#   הריצה של 23:00 נספרת כ-EOD אוטומטית ב-main.py (שעון ניו יורק >= 16:00).
#   בלי market_gate.py, בלי שורות כפולות.

on:
  schedule:
    - cron: '5 17-23 * * 1-5'
      timezone: "Asia/Jerusalem"
  workflow_dispatch:

jobs:
  run-sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ריצה אחת בכל פעם, כדי ששתי ריצות לא יכתבו ל-Daily Log במקביל
    concurrency:
      group: wtc-sentinel-single-run
      cancel-in-progress: false
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install Dependencies
        run: |
          pip install pandas yfinance requests google-api-python-client google-auth-httplib2 google-auth-oauthlib google-genai pytz

      - name: Run Sentinel Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
