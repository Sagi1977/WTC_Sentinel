name: WTC Sentinel Execution

on:
  schedule:
    # ── פתיחת שוק + שעה ראשונה (16:30-17:00 ישראל = 13:30-14:00 UTC) ──
    - cron: '30 13 * * 2-5'      # 16:30 — פתיחת שוק
    - cron: '45 13 * * 2-5'      # 16:45 — 15 דק אחרי פתיחה
    - cron: '0 14 * * 2-5'       # 17:00 — 30 דק אחרי פתיחה

    # ── אמצע המסחר כל 30 דק (17:30-20:30 ישראל = 14:30-17:30 UTC) ──
    - cron: '30 14 * * 2-5'      # 17:30
    - cron: '0,30 15 * * 2-5'    # 18:00, 18:30
    - cron: '0,30 16 * * 2-5'    # 19:00, 19:30
    - cron: '0,30 17 * * 2-5'    # 20:00, 20:30

    # ── שעה אחרונה — הכי קריטי! (21:00-22:30 ישראל = 18:00-19:30 UTC) ──
    - cron: '0,30 18 * * 2-5'    # 21:00, 21:30
    - cron: '0,30 19 * * 2-5'    # 22:00, 22:30

    # ── סגירה + Golden Filter (23:15 ישראל = 20:15 UTC) ──
    # רץ גם שני! (Golden Filter נוצר שני בלילה)
    - cron: '15 20 * * 1-5'      # 23:15

  workflow_dispatch:

jobs:
  run-sentinel:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas yfinance requests google-api-python-client google-auth-httplib2 google-auth-oauthlib google-genai pytz

      - name: Run Sentinel Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
